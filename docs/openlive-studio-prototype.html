<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="gjSpRM0OJI23OnHrhQ8flk">
<head data-page-node-id="mPtCWsEfVIGSGCeNSEvovE">
<meta charset="UTF-8" data-page-node-id="GNL8nP5IlQm8noe5BaTAhH">
<meta name="viewport" content="width=device-width, initial-scale=1" data-page-node-id="ixdCNa9kE8Tfm3LfNvJGwh">
<title>OBS Studio 30.1 — OpenLiveStudio 场景集合</title>
<style>
:root{
  --bg:#131313;
  --panel:#1d1d1d;
  --menubar:#1b1b1b;
  --panel-2:#232323;
  --head:#262626;
  --line:#2e2e2e;
  --line-hard:#0d0d0d;
  --text:#d6d6d6;
  --text-dim:#8c8c8c;
  --btn:#333333;
  --btn-hover:#3f3f3f;
  --btn-active:#2a2a2a;
  --sel:#2d5b86;
  --sel-hover:#356894;
  --red:#d04a4a;
  --green:#3f9f4a;
  --blue:#2b7fd4;
  --font:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#0b0b0b;color:var(--text);
  font:12px/1.45 var(--font);overflow:hidden;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
svg{display:block}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:#141414}
::-webkit-scrollbar-thumb{background:#3a3a3a;border:2px solid #141414;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#4a4a4a}

.win{height:100vh;display:flex;flex-direction:column;background:var(--bg)}

/* ---------- 标题栏 ---------- */
.titlebar{
  position:relative;flex:0 0 auto;height:30px;display:flex;align-items:center;gap:8px;padding-left:9px;
  background:#0f0f0f;border-bottom:1px solid #000;
}
.titlebar .app-ic{width:16px;height:16px;border-radius:3px;background:linear-gradient(135deg,#2b6ef2,#7c4dff);display:grid;place-items:center;margin-right:auto}
.titlebar .app-ic svg{width:10px;height:10px}
/* 绝对定位 + 左右等宽留白，标题才会相对窗口居中；否则会被右侧窗口按钮挤偏 */
.titlebar .t{
  position:absolute;left:0;right:0;top:0;height:30px;line-height:30px;padding:0 140px;box-sizing:border-box;
  text-align:center;font-size:11.5px;color:#a9a9a9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  pointer-events:none;
}
.wbtn{width:44px;height:30px;display:grid;place-items:center;color:#c9c9c9}
.wbtn:hover{background:#2a2a2a}
.wbtn.close:hover{background:#c42b1c;color:#fff}

/* ---------- 菜单栏 ---------- */
.menubar{
  flex:0 0 auto;height:26px;display:flex;align-items:stretch;background:var(--menubar);
  border-bottom:1px solid #0a0a0a;position:relative;z-index:40;
}
.menu{position:relative;display:flex;align-items:center;padding:0 9px;font-size:11.5px;color:#cfcfcf}
.menu:hover,.menu.open{background:#343434;color:#fff}
.menu-pop{
  position:absolute;top:26px;left:0;min-width:196px;background:#242424;border:1px solid #3a3a3a;
  box-shadow:0 8px 24px rgba(0,0,0,.6);padding:3px;display:none;
}
.menu.open .menu-pop{display:block}
.menu-pop .mi{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:5px 10px;font-size:11.5px;color:#d2d2d2;white-space:nowrap;min-width:150px}
.menu-pop .mi:hover{background:var(--sel);color:#fff}
.menu-pop .msep{height:1px;background:#3a3a3a;margin:4px 2px}
.menu-pop .mi .k{color:#7d7d7d;font-size:10.5px}
.menu-pop .mi:hover .k{color:#cfe0ee}

/* ---------- 主体 ---------- */
.body{
  flex:1 1 auto;min-height:0;display:grid;
  grid-template-columns:238px minmax(0,1fr);
  grid-template-rows:minmax(0,1fr) 198px;
  gap:3px;padding:3px;background:#0b0b0b;
}
.col{display:flex;flex-direction:column;gap:3px;min-height:0}
.col > .preview-wrap{flex:1 1 auto}
/* 左列纵向贯穿两行，底部停靠条只占预览下方的第二个格子 */
.col-left{grid-row:1 / span 2}

/* 底部停靠条：混音器 / 场景转场 / 控制，顺序固定，从左到右 */
.bottom-docks{display:flex;gap:3px;min-height:0}
.bottom-docks .dock.mixer{flex:1 1 auto;min-width:0}
.bottom-docks .dock.trans{flex:0 0 224px}
.bottom-docks .dock.controls{flex:0 0 286px}

/* ---------- 面板显隐 / 全屏预览 ---------- */
.dock.dock-hidden{display:none}
.bottom-docks.dock-hidden{display:none}
.body.no-left{grid-template-columns:minmax(0,1fr)}
.body.no-bottom{grid-template-rows:minmax(0,1fr)}
.win.pv-full .titlebar,.win.pv-full .menubar,.win.pv-full .bottom-docks,.win.pv-full .statusbar,
.win.pv-full .col-left{display:none}
.win.pv-full .body{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:0;padding:0}
.win.pv-full .preview-wrap{border:0}
.pv-exit{
  position:fixed;right:14px;bottom:14px;z-index:80;display:none;
  padding:5px 10px;border-radius:3px;background:rgba(0,0,0,.62);
  border:1px solid rgba(255,255,255,.14);color:#d8d8d8;font-size:11px;
}
.win.pv-full .pv-exit{display:block}
.col-left .dock.scenes{flex:0 0 34%}
.col-left .dock.sources{flex:1 1 auto}

/* ---------- dock ---------- */
.dock{
  display:flex;flex-direction:column;min-height:0;background:var(--panel);
  border:1px solid #0a0a0a;overflow:hidden;
}
.dock-h{
  flex:0 0 auto;height:24px;display:flex;align-items:center;gap:4px;padding:0 3px 0 8px;
  background:var(--head);border-bottom:1px solid #131313;font-size:11px;color:#b6b6b6;
}
.dock-h .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-h .hb{width:16px;height:16px;display:grid;place-items:center;color:var(--text-dim);border-radius:2px;opacity:.55}
.dock-h:hover .hb{opacity:1}
.dock-h .hb:hover{background:#3a3a3a;color:#fff}
.dock-b{flex:1 1 auto;min-height:0;overflow:auto;padding:2px}
#sceneList,#sourceList{overflow-x:hidden;overflow-y:auto}
#sceneList::-webkit-scrollbar,#sourceList::-webkit-scrollbar{width:12px}
#sceneList::-webkit-scrollbar-track,#sourceList::-webkit-scrollbar-track{background:#232323}
#sceneList::-webkit-scrollbar-thumb,#sourceList::-webkit-scrollbar-thumb{background:#606060;border:2px solid #232323;border-radius:6px}
#sceneList::-webkit-scrollbar-thumb:hover,#sourceList::-webkit-scrollbar-thumb:hover{background:#808080}
#sceneList::-webkit-scrollbar-thumb:active,#sourceList::-webkit-scrollbar-thumb:active{background:#9a9a9a}
.dock-f{
  flex:0 0 auto;height:26px;display:flex;align-items:center;gap:1px;padding:0 3px;
  background:#191919;border-top:1px solid #0a0a0a;
}
.dock-f button{width:22px;height:20px;display:grid;place-items:center;color:#b0b0b0;border-radius:2px}
.dock-f button:hover{background:#353535;color:#fff}
.dock-f button:active{background:#242424}
.dock-f .sep{width:1px;height:13px;background:#333;margin:0 3px}
.dock-f .push{margin-left:auto}

/* 列表行 */
.row{
  display:flex;align-items:center;gap:6px;height:25px;padding:0 4px 0 5px;border-radius:2px;
  font-size:11.5px;color:#cdcdcd;cursor:default;
}
.row:hover{background:#2b2b2b}
.row.sel{background:var(--sel);color:#fff}
.row.sel:hover{background:var(--sel-hover)}
.row .ic{width:14px;height:14px;flex:0 0 auto;opacity:.8}
.row .nm{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mini{
  width:16px;height:16px;flex:0 0 auto;display:grid;place-items:center;color:#cfcfcf;opacity:.5;border-radius:2px;
}
.row.sel .mini{color:#fff;opacity:.8}
.row .mini:hover{opacity:1;background:rgba(255,255,255,.14)}
.row.hidden .nm{opacity:.4}
.row.hidden .ic{opacity:.32}
.row .sub{display:none}

/* ---------- 预览 ---------- */
.preview-wrap{position:relative;background:#000;border:1px solid #0a0a0a;min-height:0;display:flex;flex-direction:column}
.preview{
  flex:1 1 auto;min-height:0;display:grid;place-items:center;background:#000;position:relative;overflow:hidden;
}
.canvas{position:relative;background:#000;overflow:hidden;box-shadow:0 0 0 1px #232323}
.src-box{position:absolute;overflow:hidden;cursor:move}
.src-box .inner{width:100%;height:100%;transform-origin:center}
.src-box svg,.src-box canvas{width:100%;height:100%;display:block}
.src-box.locked{cursor:not-allowed}
.src-box.hidden{display:none}

/* 休息画面 */
.brb-wrap{display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#1f2b3f 0%,#131a26 55%,#0a0e15 100%);text-align:center}
.brb{display:flex;flex-direction:column;align-items:center;gap:10px}
.brb-mark{width:54px;height:54px;border-radius:50%;border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;margin-bottom:4px}
.brb-mark svg{width:26px;height:26px}
.brb b{font-size:46px;font-weight:600;color:#e9f1fb;letter-spacing:.06em}
.brb span{font-size:15px;color:rgba(200,215,235,.55);letter-spacing:.08em}

/* 选中框 */
.selbox{position:absolute;border:2px solid #d04545;pointer-events:none;display:none;z-index:60}
.selbox.on{display:block}
.selbox .h{
  position:absolute;width:8px;height:8px;background:#d04545;border:1px solid #fff;
  pointer-events:auto;box-shadow:0 0 0 1px rgba(0,0,0,.4);
}
.selbox .h[data-dir="nw"]{left:-5px;top:-5px;cursor:nwse-resize}
.selbox .h[data-dir="n"]{left:50%;top:-5px;margin-left:-4px;cursor:ns-resize}
.selbox .h[data-dir="ne"]{right:-5px;top:-5px;cursor:nesw-resize}
.selbox .h[data-dir="e"]{right:-5px;top:50%;margin-top:-4px;cursor:ew-resize}
.selbox .h[data-dir="se"]{right:-5px;bottom:-5px;cursor:nwse-resize}
.selbox .h[data-dir="s"]{left:50%;bottom:-5px;margin-left:-4px;cursor:ns-resize}
.selbox .h[data-dir="sw"]{left:-5px;bottom:-5px;cursor:nesw-resize}
.selbox .h[data-dir="w"]{left:-5px;top:50%;margin-top:-4px;cursor:ew-resize}

.preview-hint{
  position:absolute;left:8px;bottom:6px;font-size:10.5px;color:#5c5c5c;pointer-events:none;
}
.trans-outgoing{position:absolute;inset:0;margin:auto;pointer-events:none;z-index:70}
.dur input:disabled{opacity:.45;cursor:default}

/* ---------- 混音器 ---------- */
.mixer-cols{display:flex;gap:2px;padding:6px 4px;align-items:flex-start;justify-content:space-around;overflow-x:auto}
.mcol{flex:1 1 0;min-width:72px;display:flex;flex-direction:column;align-items:center;gap:4px}
.mcol .mtop{display:flex;gap:2px;align-items:center;height:18px}
.mcol .mtop button{width:16px;height:16px;display:grid;place-items:center;color:#a5a5a5;border-radius:2px}
.mcol .mtop button:hover{background:#3a3a3a;color:#fff}
.mcol .mtop button.on{color:#e8b04b}
.mbody{display:flex;gap:3px;height:92px}
.meter{width:6px;height:92px;background:#0c0c0c;border:1px solid #000;position:relative;overflow:hidden}
.meter i{
  position:absolute;left:0;right:0;top:0;bottom:0;
  background:linear-gradient(to top,#1f7a33 0%,#35a648 62%,#c9c93a 84%,#d04a4a 96%);
  clip-path:inset(calc(100% - var(--lvl,0%)) 0 0 0);
  transition:clip-path .11s linear;
}
.fader{height:92px;width:26px;display:grid;place-items:center}
.fader input{
  width:86px;transform:rotate(-90deg);appearance:none;-webkit-appearance:none;
  height:16px;background:transparent;outline:none;
}
.fader input::-webkit-slider-runnable-track{height:4px;background:#111;border:1px solid #3a3a3a;border-radius:2px}
.fader input::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:16px;margin-top:-7px;border-radius:2px;
  background:linear-gradient(#d8d8d8,#a8a8a8);border:1px solid #555;
}
.mname{font-size:10px;color:#b9b9b9;text-align:center;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.mcol.muted .mname{color:#787878}
.mcol.muted .meter{opacity:.25}
.mcol.muted .fader{opacity:.6}
.mdb{font:500 9.5px var(--mono);color:#767676}

/* ---------- 转场 ---------- */
.trans-b{padding:7px 8px;display:flex;flex-direction:column;gap:7px;height:100%}
.trans-row{display:flex;gap:5px}
.trans-row select{flex:1}
.dur{display:flex;align-items:center;gap:4px;font-size:11px;color:#9d9d9d}
.dur input{width:62px;text-align:right}
/* ---------- 表单控件 ---------- */
select,input[type=text],input[type=number]{
  background:#171717;border:1px solid #3a3a3a;color:#d8d8d8;border-radius:2px;
  padding:4px 6px;font:inherit;font-size:11.5px;outline:none;min-width:0;
}
select{cursor:pointer}
select:hover,input:hover{border-color:#4a4a4a}
select:focus,input:focus{border-color:#4b84c4}

/* ---------- 控制面板（停靠窗口） ---------- */
.ctrl-body{flex:1 1 auto;min-height:0;padding:8px 7px 7px;display:flex;flex-direction:column;gap:7px;overflow:auto}
/* 三个按钮纵向等分整个面板高度，避免下方留空 */
.ctrl-grid{flex:1 1 auto;display:grid;grid-template-columns:1fr;grid-auto-rows:1fr;gap:6px;min-height:0}
.cbtn{
  min-height:28px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 7px;
  background:var(--btn);border:1px solid #2b2b2b;border-radius:3px;font-size:11.5px;color:#dcdcdc;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cbtn:hover{background:var(--btn-hover)}
.cbtn:active{background:var(--btn-active)}
.cbtn svg{width:13px;height:13px;flex:0 0 auto}
.cbtn .dot{width:9px;height:9px;border-radius:50%;background:#c9453f;flex:0 0 auto}
.cbtn.active{border-color:#7a2f2b;background:#3a2422;color:#f0b3ad}
.cbtn.active .dot{border-radius:1px}
.cbtn.live.active{border-color:#2f6b33;background:#1e3120;color:#a8dfa6}

/* ---------- 状态栏 ---------- */
.statusbar{
  flex:0 0 auto;height:24px;display:flex;align-items:center;gap:16px;padding:0 9px;
  background:#141414;border-top:1px solid #0a0a0a;font-size:10.5px;color:#7f7f7f;
  white-space:nowrap;overflow:hidden;
}
.statusbar b{color:#a8a8a8;font-weight:500;font-family:var(--mono);font-size:10.5px}
.statusbar .dot{width:6px;height:6px;border-radius:50%;background:#3f9f4a;flex:0 0 auto}
.statusbar .dot.rec{background:var(--red);animation:blink 1.05s steps(1) infinite}
.statusbar .dot.off{background:#4a4a4a}
.statusbar .sp{flex:1}
@keyframes blink{50%{opacity:.2}}

/* ---------- 对话框 ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:120;
}
.overlay.on{display:grid}
.dlg{
  width:440px;max-width:92vw;max-height:86vh;display:flex;flex-direction:column;
  background:#232323;border:1px solid #454545;border-radius:3px;
  box-shadow:0 18px 48px rgba(0,0,0,.7);
}
.dlg-h{
  height:28px;display:flex;align-items:center;padding:0 8px;background:#2d2d2d;
  border-bottom:1px solid #111;font-size:11.5px;color:#dcdcdc;
}
.dlg-h .x{margin-left:auto;width:18px;height:18px;display:grid;place-items:center;color:#aaa;border-radius:2px}
.dlg-h .x:hover{background:#c42b1c;color:#fff}
.dlg-b{padding:12px 14px;display:flex;flex-direction:column;gap:9px;overflow:auto;min-height:0}
.dlg-f{
  display:flex;justify-content:flex-end;gap:6px;padding:9px 12px;background:#1e1e1e;border-top:1px solid #111;
}
.btn{
  min-width:74px;height:26px;background:#333;border:1px solid #2b2b2b;border-radius:3px;
  font-size:11.5px;color:#dcdcdc;display:inline-flex;align-items:center;justify-content:center;
}
.btn:hover{background:#3f3f3f}
.btn:active{background:#2a2a2a}
.btn.primary{background:#2b5c8c;border-color:#376d9f;color:#fff}
.btn.primary:hover{background:#33689b}
.fld{display:grid;grid-template-columns:104px minmax(0,1fr);align-items:center;gap:8px;font-size:11.5px;color:#c4c4c4}
.fld.top{align-items:start}
.fld .hint{font-size:10.5px;color:#7a7a7a;margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini-fld{display:grid;grid-template-columns:16px minmax(0,1fr);align-items:center;gap:5px;font-size:10.5px;color:#8d8d8d}
.mini-fld input{width:100%}
.grp-title{font-size:10.5px;color:#8a8a8a;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.chk{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#c4c4c4}
.chk input{accent-color:#2b7fd4;width:13px;height:13px}
.dlg-sep{height:1px;background:#333;margin:3px 0}

.slider-row{display:flex;flex-direction:column;gap:4px}
.slider-row .sl-top{display:flex;justify-content:space-between;font-size:11px;color:#b4b4b4}
.slider-row .sl-top output{font-family:var(--mono);color:#ddd}
input[type=range].h{
  -webkit-appearance:none;appearance:none;width:100%;height:4px;background:#111;border:1px solid #3a3a3a;border-radius:2px;outline:none;
}
input[type=range].h::-webkit-slider-thumb{
  -webkit-appearance:none;width:12px;height:14px;border-radius:2px;background:linear-gradient(#dcdcdc,#a8a8a8);border:1px solid #555;
}

/* 滤镜对话框 */
.filter-dlg{width:560px}
.filter-body{display:grid;grid-template-columns:170px minmax(0,1fr);gap:0;min-height:230px}
.flist{border-right:1px solid #333;padding:4px;display:flex;flex-direction:column;gap:2px;background:#1c1c1c}
.flist .fitem{display:flex;align-items:center;gap:6px;height:24px;padding:0 6px;border-radius:2px;font-size:11.5px;color:#cdcdcd}
.flist .fitem:hover{background:#2b2b2b}
.flist .fitem.sel{background:var(--sel);color:#fff}
.flist .fitem .tick{width:12px;height:12px;border:1px solid #666;border-radius:2px;display:grid;place-items:center;font-size:9px;color:#8fce8f}
.flist .fitem .tick.on{background:#2b7fd4;border-color:#2b7fd4;color:#fff}
.fprops{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.fprops .empty{color:#777;font-size:11px;padding-top:8px}

/* 提示 */
.toast{
  position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#2a2a2a;border:1px solid #4a4a4a;
  color:#ddd;font-size:11.5px;padding:7px 14px;border-radius:3px;box-shadow:0 8px 24px rgba(0,0,0,.6);
  z-index:200;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;white-space:nowrap;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
</style>
</head>

  if (s.type === 'camera') {

      ? `brightness(${cameraFilter.brightness}%) contrast(${cameraFilter.contrast}%) saturate(${cameraFilter.saturation}%)`
      : 'none';
  }

function rectToPct(el, s) {
  el.style.left = (s.x / LOGICAL_W * 100) + '%';
  el.style.top = (s.y / LOGICAL_H * 100) + '%';
  el.style.width = (s.w / LOGICAL_W * 100) + '%';
  el.style.height = (s.h / LOGICAL_H * 100) + '%';
}

function updateSelBox() {
  const sb = $('#selbox');
  const s = state.selected ? findSource(state.selected) : null;
  if (!s || !s.visible) { sb.classList.remove('on'); return; }
  const box = document.querySelector(`.src-box[data-id="${s.id}"]`);
  if (!box) { sb.classList.remove('on'); return; }
  sb.classList.add('on');
  sb.style.left = box.style.left;
  sb.style.top = box.style.top;
  sb.style.width = box.style.width;
  sb.style.height = box.style.height;
}

/* ---------- 拖动 / 缩放 ---------- */
let drag = null;
function startDrag(e, id, mode, dir) {
  const s = findSource(id);
  if (!s || !s.visible) return;
  if (id !== state.selected) selectSource(id);
  if (s.locked && mode === 'move') return;
  e.preventDefault();
  e.stopPropagation();

  const canvasRect = $('#canvas').getBoundingClientRect();
  drag = {
    mode, dir, id,
    startX: e.clientX, startY: e.clientY,
    o: { x: s.x, y: s.y, w: s.w, h: s.h },
    scaleX: LOGICAL_W / canvasRect.width,
    scaleY: LOGICAL_H / canvasRect.height
  };
  document.body.style.cursor = mode === 'move' ? 'move' : (dir.length === 2 ? 'nwse-resize' : (dir === 'n' || dir === 's' ? 'ns-resize' : 'ew-resize'));
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', endDrag, { once: true });
}

function onDragMove(e) {
  if (!drag) return;
  const s = findSource(drag.id);
  const dx = (e.clientX - drag.startX) * drag.scaleX;
  const dy = (e.clientY - drag.startY) * drag.scaleY;
  const o = drag.o;

  if (drag.mode === 'move') {
    s.x = Math.round(clamp(o.x + dx, -o.w + 40, LOGICAL_W - 40));
    s.y = Math.round(clamp(o.y + dy, -o.h + 40, LOGICAL_H - 40));
  } else {
    const d = drag.dir;
    if (d.length === 2) {                       // 角点：等比缩放
      const k = Math.max(0.08, 1 + (dx / o.w + dy / o.h) / 2);
      const w = Math.max(40, o.w * k), h = Math.max(40, o.h * k);
      if (d.includes('e')) s.w = Math.round(w); else { s.x = Math.round(o.x + o.w - w); s.w = Math.round(w); }
      if (d.includes('s')) s.h = Math.round(h); else { s.y = Math.round(o.y + o.h - h); s.h = Math.round(h); }
    } else if (d === 'e') { s.w = Math.round(Math.max(40, o.w + dx)); }
    else if (d === 'w') { const w = Math.max(40, o.w - dx); s.x = Math.round(o.x + o.w - w); s.w = Math.round(w); }
    else if (d === 's') { s.h = Math.round(Math.max(40, o.h + dy)); }
    else if (d === 'n') { const h = Math.max(40, o.h - dy); s.y = Math.round(o.y + o.h - h); s.h = Math.round(h); }
  }
  const box = document.querySelector(`.src-box[data-id="${s.id}"]`);
  if (box) rectToPct(box, s);
  updateSelBox();
}

function endDrag() {
  if (!drag) return;
  drag = null;
  document.body.style.cursor = '';
  window.removeEventListener('pointermove', onDragMove);
  const s = state.selected ? findSource(state.selected) : null;
  if (s) msg(`${s.name}：X ${s.x} · Y ${s.y} · ${s.w}×${s.h}`);
}

      </div>
      <div class="mdb" data-db>${dbText(a.vol)}</div>
      <div class="mname">${a.name}</div>
    </div>`).join('')}</div>`;

  $$('.mcol', box).forEach(col => {
    const i = +col.dataset.i;
    const a = audioSources[i];
    col.querySelector('[data-mute]').addEventListener('click', () => {

      a.vol = +e.target.value;
      col.querySelector('[data-db]').textContent = dbText(a.vol);
    });
  });
}

function dbText(v) {
  if (v <= 0) return '-∞ dB';
  return (20 * Math.log10(v / 100)).toFixed(1) + ' dB';
}

let meterTimer = null;
function tickMeters() {
  $$('.mcol').forEach((col, i) => {
    const a = audioSources[i];
    if (!a) return;
    const base = a.mute ? 0 : (a.vol / 100) * (state.liveOn || state.recOn ? 0.95 : 0.7);
    a.lvl = clamp(a.lvl * 0.55 + (base * rnd(0.55, 1.0)) * 0.45, 0, 1);
    $$('[data-meter]', col).forEach((m, ch) => {
      const jitter = ch === 0 ? rnd(-0.03, 0.05) : rnd(-0.05, 0.03);
      m.style.setProperty('--lvl', (clamp(a.lvl + jitter, 0, 1) * 100).toFixed(0) + '%');
    });
  });
}

/* ---------- 摄像头画面 ---------- */
let camCtx = null;
function drawCam(t) {
  if (!camCtx) return;
  const g = camCtx, W = 640, H = 360;
  g.setTransform(1, 0, 0, 1, 0, 0);

  const bg = g.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#2b2937');
  bg.addColorStop(0.55, '#1d1b26');
  bg.addColorStop(1, '#121019');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  // 墙上的画框
  g.fillStyle = 'rgba(255,255,255,.04)';
  g.fillRect(52, 34, 130, 96);
  g.strokeStyle = 'rgba(255,255,255,.09)';
  g.lineWidth = 2; g.strokeRect(52, 34, 130, 96);
  g.fillStyle = 'rgba(120,170,255,.10)';
  g.beginPath(); g.moveTo(64, 120); g.lineTo(100, 78); g.lineTo(132, 104); g.lineTo(160, 86); g.lineTo(170, 120); g.closePath(); g.fill();

  // 台灯暖光
  const lamp = g.createRadialGradient(540, 60, 0, 540, 60, 250);
  lamp.addColorStop(0, 'rgba(255,186,120,.30)');
  lamp.addColorStop(1, 'rgba(255,186,120,0)');
  g.fillStyle = lamp; g.fillRect(0, 0, W, H);

  const sway = Math.sin(t / 1700) * 3.5;

  // 肩膀
  g.beginPath();
  g.ellipse(320 + sway, 372, 168, 100, 0, Math.PI, 0);
  g.fillStyle = '#2f3746';
  g.fill();
  // 衣领
  g.beginPath();
  g.moveTo(285 + sway, 300); g.lineTo(320 + sway, 344); g.lineTo(355 + sway, 300);
  g.strokeStyle = 'rgba(255,255,255,.10)'; g.lineWidth = 3; g.stroke();

  // 脖子
  g.fillStyle = '#b98a6c';
  g.fillRect(302 + sway, 250, 36, 50);

  // 头
  g.beginPath();
  g.ellipse(320 + sway, 196, 61, 72, 0, 0, Math.PI * 2);
  g.fillStyle = '#c99a78';
  g.fill();

  // 头发
  g.beginPath();
  g.ellipse(320 + sway, 168, 64, 58, 0, Math.PI * 1.02, Math.PI * 1.98);
  g.fillStyle = '#221b18';
  g.fill();

  // 五官（极简）
  g.fillStyle = 'rgba(40,28,22,.75)';
  g.beginPath(); g.ellipse(300 + sway, 194, 5, 3.4, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(340 + sway, 194, 5, 3.4, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(40,28,22,.55)'; g.lineWidth = 2.4; g.beginPath();
  g.arc(320 + sway, 224, 16, 0.25, Math.PI - 0.25); g.stroke();

  // 面部受光
  const face = g.createRadialGradient(292 + sway, 176, 4, 292 + sway, 176, 80);
  face.addColorStop(0, 'rgba(255,225,190,.20)');
  face.addColorStop(1, 'rgba(255,225,190,0)');
  g.fillStyle = face; g.fillRect(0, 0, W, H);

  // 暗角 + 扫描感
  const vig = g.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.95);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,.55)');
  g.fillStyle = vig; g.fillRect(0, 0, W, H);

  // 轻微噪点
  g.fillStyle = 'rgba(255,255,255,.022)';
  for (let i = 0; i < 5; i++) g.fillRect(Math.random() * W, Math.random() * H, 2, 2);
}

/* ---------- 转场：仅演示原型素材，不代表真实合成或输出 ---------- */
let activeTransition = null;
function syncTransitionControls() {
  const busy = activeTransition !== null;
  $('#transSel').disabled = busy;
  $('#transDur').disabled = busy || $('#transSel').value === '剪切';
}
function cancelTransition() {
  if (!activeTransition) return;
  const previous = activeTransition;
  activeTransition = null;
  previous.animation.cancel();
  previous.overlay.remove();
  syncTransitionControls();
}
$('#transSel').addEventListener('change', syncTransitionControls);
function transitionToScene(next) {
  if (activeTransition || !scenes[next] || next === state.scene) return;
  if ($('#transSel').value === '剪切') {
    switchScene(next);
    return;
  }
  const input = $('#transDur');
  const duration = Number.isFinite(input.valueAsNumber)
    ? Math.max(0, Math.min(20000, input.valueAsNumber)) : 300;
  input.value = duration;
  if (duration === 0) {
    switchScene(next);
    return;
  }
  // Freeze the outgoing prototype canvas, including its simulated camera frame.
  const canvas = $('#canvas');
  const overlay = canvas.cloneNode(true);
  overlay.removeAttribute('id');
  overlay.classList.add('trans-outgoing');
  overlay.setAttribute('aria-hidden', 'true');
  overlay.querySelector('.selbox')?.remove();
  const frames = canvas.querySelectorAll('canvas');
  overlay.querySelectorAll('canvas').forEach((frame, index) => {
    frame.getContext('2d').drawImage(frames[index], 0, 0);
  });
  switchScene(next);
  canvas.parentElement.appendChild(overlay);
  const animation = overlay.animate([{ opacity: 1 }, { opacity: 0 }],
    { duration, easing: 'linear', fill: 'forwards' });
  const transition = { animation, overlay };
  activeTransition = transition;
  syncTransitionControls();
  animation.finished.then(() => {
    if (activeTransition === transition) cancelTransition();
  }).catch(() => {}); // Cancellation also removes the overlay synchronously.
}

/* ---------- 面板显隐 / 全屏预览 ---------- */
const dockOf = key => document.querySelector('.dock.' + key);

function toggleDock(key, force) {
  const d = dockOf(key);
  if (!d) return;
  const show = force === undefined ? d.classList.contains('dock-hidden') : force;
  d.classList.toggle('dock-hidden', !show);
  const mark = document.querySelector(`.mi[data-dock="${key}"] .k`);
  if (mark) mark.textContent = show ? '✓' : '';
  syncCols();
}

function syncCols() {
  const left = document.querySelector('.col-left');
  const bar = $('#bottomDocks');
  const hasL = !!left.querySelector('.dock:not(.dock-hidden)');
  const hasB = !!bar.querySelector('.dock:not(.dock-hidden)');
  left.style.display = hasL ? '' : 'none';
  bar.classList.toggle('dock-hidden', !hasB);
  const body = document.querySelector('.body');
  body.classList.toggle('no-left', !hasL);
  body.classList.toggle('no-bottom', !hasB);
  fitCanvas();
}

function isFullPreview() { return document.querySelector('.win').classList.contains('pv-full'); }

function setFullPreview(on) {
  document.querySelector('.win').classList.toggle('pv-full', on);
  setTimeout(fitCanvas, 60);  // 等布局切完再量尺寸
  msg(on ? '全屏预览 · F11 / Esc 退出' : '已退出全屏预览');
}

function resetLayout() {
  ['scenes', 'sources', 'mixer', 'trans', 'controls'].forEach(k => toggleDock(k, true));
  if (isFullPreview()) setFullPreview(false);
  msg('布局已重置');
}

function sceneNameError(name, target = null) {
  if (!name.trim()) return '场景名称不能为空。';
  return scenes.some(s => s !== target && s.name.trim().toLowerCase() === name.trim().toLowerCase())
    ? '场景名称已存在。' : '';
}
function suggestedSceneName() {
  let name = '场景';
  for (let number = 2; sceneNameError(name); number++) name = '场景 ' + number;
  return name;
}
function openSceneNameDialog(target = null) {
  openDialog(target ? '重命名场景' : '添加场景', `
    <label class="fld"><span>场景名称</span><input id="sceneNameInput" type="text" autocomplete="off"></label>
    <div id="sceneNameError" role="alert" style="color:#ee9b9b;min-height:18px"></div>`, () => {
    const name = $('#sceneNameInput').value.trim();
    const error = sceneNameError(name, target);
    $('#sceneNameError').textContent = error;
    if (error) return false;
    if (target) {
      target.name = name;
      renderScenes();
      msg('已重命名场景');
    } else {
      scenes.push({ name, sources: [] });
      renderScenes();
      switchScene(scenes.length - 1);
      msg('已添加场景');
    }
  });
  const input = $('#sceneNameInput');
  input.value = target ? target.name : suggestedSceneName();
  input.addEventListener('input', () => { $('#sceneNameError').textContent = ''; });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); $('#dlgOk').click(); }
  });
  input.focus();
  input.select();
}

      <option value="image">图像</option>
      <option value="text">文本</option>
    </select></div>
    <div class="fld"><span>名称</span><input type="text" id="newName" value="摄像头 2"></div>`, () => {
    const type = $('#newType').value;
    const id = 'src' + Date.now();
    curScene().sources.unshift({
      id, name: $('#newName').value || '新来源', type,
      x: 120, y: 120, w: type === 'desktop' ? 1920 : 576, h: type === 'desktop' ? 1080 : 324,
      visible: true, locked: false
    });
    state.selected = id;
    renderSources(); renderPreview();
    msg('已添加来源');
  });
  $('#newType').addEventListener('change', e => {
    $('#newName').value = { camera: '摄像头 2', desktop: '桌面 2', image: 'Logo 2', text: '文本 2' }[e.target.value];
  });
});

/* ---------- 状态栏提示 ---------- */
let msgTimer = null;
function msg(t) {
  const el = $('#sbMsg');
  el.textContent = t;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { el.textContent = '就绪'; }, 4200);
}

/* ---------- 画布尺寸 ---------- */
function fitCanvas() {
  const p = $('#preview').getBoundingClientRect();
  const c = $('#canvas');
  const pad = 12;
  let w = p.width - pad * 2, h = p.height - pad * 2;
  if (w <= 0 || h <= 0) return;
  if (w / h > 16 / 9) w = h * 16 / 9; else h = w * 9 / 16;
  c.style.width = Math.round(w) + 'px';
  c.style.height = Math.round(h) + 'px';
  if (activeTransition) {
    activeTransition.overlay.style.width = c.style.width;
    activeTransition.overlay.style.height = c.style.height;
  }
}

/* ---------- 启动 ---------- */
renderScenes();
renderSources();
renderPreview();
renderMixer();
fitCanvas();
updateOutputUI();
msg('提示：拖动预览中的红框可移动来源，拖角点等比缩放；双击来源打开属性，Ctrl+E 打开变换');
window.addEventListener('resize', fitCanvas);
new ResizeObserver(fitCanvas).observe($('#preview'));

/* 时间循环 */
let lastT = performance.now();
function loop(now) {
  const dt = (now - lastT) / 1000;
  lastT = now;
  if (state.recOn) state.recT += dt;
  if (state.liveOn) state.liveT += dt;
  drawCam(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

setInterval(() => {
  tickMeters();
  if (state.recOn || state.liveOn) {
    updateOutputUI();
    const cpu = (1.2 + Math.random() * 1.6).toFixed(1);
    $('#sbCpu').textContent = cpu + '%';
  }
}, 120);

/* 键盘 */
window.addEventListener('keydown', e => {
  if ($('#overlay').classList.contains('on')) {
    if (e.key === 'Escape') { e.preventDefault(); closeDialog(); }
    return;
  }
  if (e.key === 'F11') { e.preventDefault(); return setFullPreview(!isFullPreview()); }
  if (e.key === 'Escape' && isFullPreview()) { e.preventDefault(); return setFullPreview(false); }
  if (e.target instanceof Element && e.target.matches('input,select,textarea')) return;
  if (e.key === 'Delete' && state.selected) { removeSelected(); }
  if (e.ctrlKey && e.key.toLowerCase() === 'e') { e.preventDefault(); openTransform(); }
  const dirs = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
  if (dirs[e.key] && state.selected) {
    const s = findSource(state.selected);
    if (!s || s.locked) return;
    e.preventDefault();
    const step = e.shiftKey ? 10 : 1;
    s.x += dirs[e.key][0] * step;
    s.y += dirs[e.key][1] * step;
    const box = document.querySelector(`.src-box[data-id="${s.id}"]`);
    if (box) rectToPct(box, s);
    updateSelBox();
  }
});

/* 双击预览空白处取消选中 */
$('#preview').addEventListener('pointerdown', e => {
  if (e.target.id === 'preview' || e.target.id === 'canvas') {
    state.selected = null;
    renderSources();
    updateSelBox();
  }
});
</script>
</body>
</html>
